<head>

  <title>Review Submitted | WDD131</title>
  <link rel="stylesheet" href="styles/form.css">

<body>
  <header>
    <h1>Review Submitted</h1>
    <p class="subtitle">Thank you for your feedback</p>
  </header>

  <main>
    <div class="confirmation-card">
      <div class="confirmation-icon">✓</div>
      <h2>Review Posted Successfully!</h2>
      <p class="confirmation-message">Your review has been recorded. We appreciate you taking the time to share your experience.</p>

      <div class="review-summary" id="reviewSummary">
      </div>

      <div class="counter-section">
        <p class="counter-label">Total Reviews Submitted</p>
        <p class="counter-value" id="reviewCount">0</p>
      </div>

      <a href="form.html" class="back-link">Submit Another Review</a>
    </div>
  </main>

  <footer>
    <p>
      &copy;<span id="currentYear"></span>
      <span>&#127758;</span>
      Israel Reyes
      <span>&#127758;</span>
      Mexico
    </p>
    <p>Last Modification: <span id="lastModified"></span></p>

  <script src="scripts/form.js"></script>

</html>
