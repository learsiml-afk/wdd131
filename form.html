<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review | WDD131</title>
  <link rel="stylesheet" href="styles/form.css">
</head>
<body>
  <header>
    <h1>Product Review</h1>
    <p class="subtitle">Share your experience with our products</p>
  </header>

  <main>
    <form method="get" action="review.html" id="reviewForm" novalidate>

      <div class="form-group">
        <label for="productName">Product Name <span class="required-mark">*</span></label>
        <select id="productName" name="product" required>
          <option value="" disabled selected>Select a Product …</option>
        </select>
      </div>

      <fieldset class="form-group rating-group">
        <legend>Overall Rating <span class="required-mark">*</span></legend>
        <div class="star-rating">
          <input type="radio" id="star1" name="rating" value="1" required>
          <label for="star1" title="1 star">★</label>

          <input type="radio" id="star2" name="rating" value="2">
          <label for="star2" title="2 stars">★</label>

          <input type="radio" id="star3" name="rating" value="3">
          <label for="star3" title="3 stars">★</label>

          <input type="radio" id="star4" name="rating" value="4">
          <label for="star4" title="4 stars">★</label>

          <input type="radio" id="star5" name="rating" value="5">
          <label for="star5" title="5 stars">★</label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="installDate">Date of Installation <span class="required-mark">*</span></label>
        <input type="date" id="installDate" name="installDate" required>
      </div>

      <fieldset class="form-group checkbox-group">
        <legend>Useful Features <span class="hint">(Check all that apply)</span></legend>
        <div class="checkbox-item">
          <input type="checkbox" id="durability" name="features" value="Durability">
          <label for="durability">Durability</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
          <label for="easeOfUse">Ease of Use</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="performance" name="features" value="Performance">
          <label for="performance">Performance</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="design" name="features" value="Design">
          <label for="design">Design</label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="writtenReview">Written Review <span class="hint">(Optional)</span></label>
        <textarea id="writtenReview" name="writtenReview" rows="5" placeholder="Tell us what you think..."></textarea>
      </div>

      <div class="form-group">
        <label for="userName">Your Name <span class="hint">(Optional)</span></label>
        <input type="text" id="userName" name="userName" placeholder="Enter your name">
      </div>

      <div class="form-group submit-group">
        <input type="submit" value="Post Review" id="submitBtn">
      </div>

    </form>
  </main>

  <footer>
    <p>
      &copy;<span id="currentYear"></span>
      <span>&#127758;</span>
      Israel Martinez
      <span>&#127758;</span>
      Mexico
    </p>
    <p>Last Modification: <span id="lastModified"></span></p>
  </footer>

  <script src="scripts/form.js"></script>
</body>
</html>
